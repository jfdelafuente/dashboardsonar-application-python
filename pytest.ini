[pytest]
# Pytest Configuration for Dashboard Sonar

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (isolated, fast, no database)
    functional: Functional tests (integration with Flask app)
    api: API endpoint tests
    slow: Tests that take more than 1 second
    integration: Integration tests (database, external services)
    security: Security-related tests
    auth: Authentication and authorization tests
    models: Database model tests
    services: Service layer tests
    repositories: Repository pattern tests
    utils: Utility function tests

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Coverage options (when using --cov)
[coverage:run]
source = infocodest
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Minimum coverage percentage (fail if below)
fail_under = 70

# Test paths
testpaths = tests

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
