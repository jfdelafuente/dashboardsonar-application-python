name: CI - Pull Request Validation

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Job 1: Code Quality & Linting
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Flake8
        run: |
          flake8 infocodest/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 infocodest/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run Black (check only)
        run: black --check infocodest/
        continue-on-error: true

  # Job 2: Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety check
        run: safety check --json || true
        continue-on-error: true

      - name: Run Bandit security scan
        run: bandit -r infocodest/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # Job 3: Unit Tests
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create test database
        run: |
          mkdir -p datos
          touch datos/metricas.csv
          touch datos/historico.csv
          touch datos/proveedores.csv

      - name: Run unit tests with pytest
        env:
          FLASK_APP: run.py
          FLASK_DEBUG: 0
          DEBUG: False
          TESTING: True
          SECRET_KEY: test-secret-key-for-ci
          SQLITE_DB_FILE: test.sqlite3
        run: |
          pytest tests/ -v --cov=infocodest --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report-html
          path: htmlcov/
          retention-days: 30

  # Job 4: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Setup test environment
        env:
          FLASK_APP: run.py
          FLASK_DEBUG: 0
          DEBUG: False
          TESTING: True
          SECRET_KEY: test-secret-key-for-ci
          SQLITE_DB_FILE: integration-test.sqlite3
        run: |
          python scripts/setup/setup_database.py --config Testing --non-interactive

      - name: Run integration tests
        env:
          FLASK_APP: run.py
          FLASK_DEBUG: 0
          DEBUG: False
          TESTING: True
          SECRET_KEY: test-secret-key-for-ci
          SQLITE_DB_FILE: integration-test.sqlite3
        run: |
          pytest tests/integration/ -v -m "integration"
        continue-on-error: true

  # Job 5: Build Validation
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "import infocodest; print('✓ Package imports successfully')"

      - name: Check for syntax errors
        run: |
          python -m py_compile $(find infocodest -name "*.py")

      - name: Validate configuration
        env:
          FLASK_APP: run.py
          SECRET_KEY: test-secret-key
          SQLITE_DB_FILE: test.sqlite3
        run: |
          python scripts/verification/verify_config.py

  # Job 6: PR Summary
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, unit-tests, integration-tests, build-validation]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "✓ CI Pipeline completed"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Build Validation: ${{ needs.build-validation.result }}"

      - name: Set PR status
        if: |
          needs.code-quality.result == 'success' &&
          needs.security-scan.result == 'success' &&
          needs.unit-tests.result == 'success' &&
          needs.build-validation.result == 'success'
        run: |
          echo "✓ All required checks passed!"
          exit 0

      - name: Set PR failure
        if: |
          needs.code-quality.result == 'failure' ||
          needs.security-scan.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.build-validation.result == 'failure'
        run: |
          echo "✗ Some required checks failed"
          exit 1
