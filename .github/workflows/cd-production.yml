name: CD - Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags (e.g., v1.0.0, v2.1.3)
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Job 1: Validation
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for tag validation

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Validate version tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Version tag $VERSION does not exist"
            exit 1
          fi
          echo "✓ Version tag validated: $VERSION"

      - name: Check if version is on main branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! git branch -r --contains tags/$VERSION | grep -q 'origin/main'; then
            echo "⚠ Warning: Tag $VERSION is not on main branch"
            echo "Production deployments should typically be from main branch"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run full test suite
        run: |
          pytest tests/ -v --maxfail=10
          echo "✓ All tests passed"

      - name: Security scan
        run: |
          chmod +x scripts/ci/security.sh
          ./scripts/ci/security.sh --fail-on-high

    outputs:
      version: ${{ steps.version.outputs.version }}

  # Job 2: Build approval (manual gate)
  approve-deployment:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: [validate]
    environment:
      name: production-approval

    steps:
      - name: Deployment approved
        run: |
          echo "✓ Production deployment approved for version ${{ needs.validate.outputs.version }}"
          echo "Proceeding with deployment..."

  # Job 3: Deploy to production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, approve-deployment]
    environment:
      name: production
      url: https://${{ secrets.PRODUCTION_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_SSH_KEY: ~/.ssh/production_key
        run: |
          chmod +x scripts/ci/deploy-production.sh
          ./scripts/ci/deploy-production.sh \
            --version ${{ needs.validate.outputs.version }} \
            --force

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/production_key

      - name: Save deployment info
        run: |
          echo "DEPLOYMENT_VERSION=${{ needs.validate.outputs.version }}" >> $GITHUB_ENV
          echo "DEPLOYMENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

  # Job 4: Post-deployment validation
  validate-deployment:
    name: Validate Production Deployment
    runs-on: ubuntu-latest
    needs: [validate, deploy]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting 30 seconds for deployment to stabilize..."
          sleep 30

      - name: Run production smoke tests
        env:
          SMOKE_TEST_URL: https://${{ secrets.PRODUCTION_HOST }}
          SMOKE_TEST_TIMEOUT: 20
        run: |
          chmod +x scripts/ci/smoke-tests.sh
          ./scripts/ci/smoke-tests.sh --verbose

      - name: Test critical endpoints
        run: |
          echo "Testing critical production endpoints..."

          # Test with retry logic
          MAX_RETRIES=3
          RETRY_DELAY=5

          for i in $(seq 1 $MAX_RETRIES); do
            if curl --fail --max-time 15 https://${{ secrets.PRODUCTION_HOST }}/; then
              echo "✓ Root endpoint responding"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                echo "⚠ Attempt $i failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              else
                echo "❌ Root endpoint failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Check application health
        run: |
          # Add custom health checks here
          echo "✓ Production deployment validated"

  # Job 5: Rollback on failure
  rollback:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: [validate, deploy, validate-deployment]
    if: failure() && needs.deploy.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Execute rollback
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_SSH_KEY: ~/.ssh/production_key
        run: |
          echo "⚠ Deployment validation failed - initiating rollback"
          chmod +x scripts/ci/rollback.sh
          # Get latest backup timestamp
          TIMESTAMP=$(ssh -i ~/.ssh/production_key ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "ls -t ${PRODUCTION_PATH}/../backups/production-backup-*.tar.gz | head -1 | grep -oP '\\d{8}_\\d{6}'")
          ./scripts/ci/rollback.sh --timestamp "$TIMESTAMP" --force

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/production_key

  # Job 6: Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [validate, deploy, validate-deployment]
    if: always()

    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "status=failed-validation" >> $GITHUB_OUTPUT
            echo "message=❌ Production deployment failed - Validation" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "status=failed-deployment" >> $GITHUB_OUTPUT
            echo "message=❌ Production deployment failed - Deploy" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [ "${{ needs.validate-deployment.result }}" != "success" ]; then
            echo "status=failed-post-deployment" >> $GITHUB_OUTPUT
            echo "message=❌ Production deployment failed - Validation (Rolled back)" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Production deployment successful" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "${{ steps.status.outputs.message }}",
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "fields": [
                  {"title": "Environment", "value": "Production", "short": true},
                  {"title": "Version", "value": "${{ needs.validate.outputs.version }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Author", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }' || echo "Slack notification failed (non-fatal)"

      - name: Create deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Jobs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Post-Validation: ${{ needs.validate-deployment.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if deployment unsuccessful
        if: steps.status.outputs.status != 'success'
        run: |
          echo "❌ Production deployment failed"
          exit 1
