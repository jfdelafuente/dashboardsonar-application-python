name: CD - Staging Deployment

on:
  push:
    branches: [develop]
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Job 1: Pre-deployment validation
  pre-deployment:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Quick syntax check
        run: |
          python -m py_compile $(find infocodest -name "*.py")
          echo "✓ All Python files compile successfully"

      - name: Run critical tests
        run: |
          pytest tests/unit/ -v -x --maxfail=5
          echo "✓ Critical tests passed"

  # Job 2: Deploy to staging
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [pre-deployment]
    environment:
      name: staging
      url: http://${{ secrets.STAGING_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          STAGING_SSH_KEY: ~/.ssh/staging_key
        run: |
          chmod +x scripts/ci/deploy-staging.sh
          ./scripts/ci/deploy-staging.sh --branch develop

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/staging_key

  # Job 3: Post-deployment smoke tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for application to stabilize
        run: |
          echo "Waiting 10 seconds for application to fully start..."
          sleep 10

      - name: Run smoke tests
        env:
          SMOKE_TEST_URL: http://${{ secrets.STAGING_HOST }}
          SMOKE_TEST_TIMEOUT: 15
        run: |
          chmod +x scripts/ci/smoke-tests.sh
          ./scripts/ci/smoke-tests.sh --verbose

      - name: Test specific endpoints
        run: |
          echo "Testing critical endpoints..."

          # Test root
          curl --fail --max-time 10 http://${{ secrets.STAGING_HOST }}/ || exit 1

          # Test login
          curl --fail --max-time 10 http://${{ secrets.STAGING_HOST }}/login || exit 1

          echo "✓ All critical endpoints responding"

  # Job 4: Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always()

    steps:
      - name: Check deployment status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ] && [ "${{ needs.smoke-tests.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Staging deployment successful" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Staging deployment failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "${{ steps.status.outputs.message }}",
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "fields": [
                  {"title": "Environment", "value": "Staging", "short": true},
                  {"title": "Branch", "value": "develop", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Author", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }' || echo "Slack notification failed (non-fatal)"

      - name: Create deployment summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** develop" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Jobs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-deployment: ${{ needs.pre-deployment.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Tests: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if deployment unsuccessful
        if: steps.status.outputs.status == 'failure'
        run: |
          echo "❌ Deployment or smoke tests failed"
          exit 1
