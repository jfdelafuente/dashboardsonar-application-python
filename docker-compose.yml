version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: dashboardsonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dashboardsonar}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Flask Application
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboardsonar-web
    restart: unless-stopped
    environment:
      # Flask Configuration
      FLASK_APP: run.py
      DEBUG: ${DEBUG:-False}

      # Database Configuration
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dashboardsonar}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASS: ${DB_PASS:-postgres}

      # Security
      SECRET_KEY: ${SECRET_KEY}

      # Application Settings
      ASSETS_ROOT: /static/assets
      DAYS_COMPARISON: ${DAYS_COMPARISON:-15}

      # Data Files
      DATA_DIR: ${DATA_DIR:-./datos}
      METRICAS_FILENAME: ${METRICAS_FILENAME:-metricas.csv}
      HISTORICO_FILENAME: ${HISTORICO_FILENAME:-historico.csv}
      PROVEEDORES_FILENAME: ${PROVEEDORES_FILENAME:-proveedores.csv}

    volumes:
      - ./datos:/app/datos
      - ./logs:/app/logs

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app-network

    ports:
      - "${PORT:-5000}:5000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Nginx Reverse Proxy (Optional)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: dashboardsonar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infocodest/static:/usr/share/nginx/html/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - app-network
    profiles:
      - with-nginx

# ============================================
# Networks
# ============================================
networks:
  app-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  nginx_logs:
    driver: local
